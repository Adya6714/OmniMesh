# Preview channel — needs Hosting secrets on this repo (no forks).
name: Deploy to Firebase Hosting on PR
on: pull_request

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: firebase-hosting-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: omnimesh-command
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/omnimesh-firebase-sa.json
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate Firebase service account secret & write credentials file
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OMNIMESH_COMMAND }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import json, os, pathlib, sys
          raw = os.environ.get("SA_JSON", "").strip()
          if not raw:
              print("::error::Missing FIREBASE_SERVICE_ACCOUNT_OMNIMESH_COMMAND")
              sys.exit(1)
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as e:
              print(f"::error::Invalid JSON service account: {e}")
              sys.exit(1)
          path = os.environ["GOOGLE_APPLICATION_CREDENTIALS"]
          pathlib.Path(path).write_text(raw)
          print("Using:", data.get("client_email", "?"))
          PY

      - name: Build web
        working-directory: web
        env:
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_GEMINI_API_KEY: ${{ secrets.REACT_APP_GEMINI_API_KEY }}
          REACT_APP_GEMINI_MODEL: ${{ secrets.REACT_APP_GEMINI_MODEL }}
          REACT_APP_GOOGLE_MAPS_API_KEY: ${{ secrets.REACT_APP_GOOGLE_MAPS_API_KEY }}
          REACT_APP_MAPS_API_KEY: ${{ secrets.REACT_APP_MAPS_API_KEY }}
          CI: "true"
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f build/index.html

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@14

      - name: Verify Hosting API access
        run: firebase hosting:sites:list --project "${FIREBASE_PROJECT_ID}" --non-interactive

      - name: Deploy preview channel
        env:
          PR_CHANNEL: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          firebase hosting:channel:deploy "${PR_CHANNEL}" --project "${FIREBASE_PROJECT_ID}" --expires 7d --non-interactive
