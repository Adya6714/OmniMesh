services:
  vllm-rocm:
    image: rocm/vllm:latest
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    ipc: host
    ports: ["8001:8000"]
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    command: >
      vllm serve google/gemma-2-9b-it
      --dtype bfloat16
      --max-model-len 4096
      --port 8000
      --host 0.0.0.0
    restart: unless-stopped
  backend:
    environment:
      - LOCAL_MODEL_URL=http://vllm-rocm:8000/v1
      - LOCAL_MODEL_ID=google/gemma-2-9b-it
    depends_on:
      - vllm-rocm
